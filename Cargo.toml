[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "crates/server", "crates/slack"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local mission-control harness for Claude Code."
readme = "README.md"
# release.yml and the Homebrew formula reference this same craigcode/kranz
# slug (see docs/releasing.md).
repository = "https://github.com/craigcode/kranz"
keywords = ["claude", "agent", "orchestration", "mission-control", "ai"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
kranz-engine = { version = "0.1.0", path = "crates/engine" }
kranz-server = { version = "0.1.0", path = "crates/server" }
kranz-slack = { version = "0.1.0", path = "crates/slack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
subtle = "2"
regex = "1"
globset = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cap-std = "4"
cap-fs-ext = "4"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures = "0.3"
futures-util = "0.3"
ratatui = "0.29"
crossterm = "0.28"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Pinned directly so main() can install ONE process-level CryptoProvider:
# the dependency graph enables both of rustls's provider features (reqwest
# pulls aws-lc-rs, the OTLP client pulls ring), and rustls 0.23 panics at
# the first TLS connection rather than guessing. See crates/cli/src/main.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "trace", "reqwest-client", "reqwest-rustls"] }
