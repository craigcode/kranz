name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Determine scan range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SCAN_RANGE=HEAD" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "SCAN_RANGE=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "SCAN_RANGE=HEAD" >> "$GITHUB_ENV"
          else
            echo "SCAN_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - run: cargo run --package kranz -- scan --range "$SCAN_RANGE"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux sandbox tooling
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Configure git identity (git_ops tests)
        run: |
          git config --global user.name kranz-ci
          git config --global user.email ci@kranz.local
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast: report every failing test target, not just the first,
      # so a cross-platform break surfaces in one run instead of one per push.
      - run: cargo test --workspace --no-fail-fast

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - run: npx tsc --noEmit
        working-directory: apps/dashboard
      - run: npm run build
        working-directory: apps/dashboard
      - run: npm run test
        working-directory: apps/dashboard
      - run: npm run lint
        working-directory: apps/dashboard

  # One real-model smoke mission, manual trigger only (costs tokens).
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Claude Code
        # Pinned to an exact version: this job carries ANTHROPIC_API_KEY, so an
        # unpinned install would auto-pull any newly published (possibly
        # hijacked) release straight into a secret-bearing environment. Bump
        # deliberately.
        run: npm install --global @anthropic-ai/claude-code@2.1.206
      - name: Build kranz
        run: cargo build --release --locked --package kranz --bin kranz
      - name: Run flagship live acceptance mission
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KRANZ_BIN: ${{ github.workspace }}/target/release/kranz
          ARTIFACT_DIR: ${{ runner.temp }}/kranz-acceptance-artifacts
        run: bash scripts/acceptance-smoke.sh
      - name: Upload mission record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flagship-acceptance-mission
          path: ${{ runner.temp }}/kranz-acceptance-artifacts
          if-no-files-found: warn
