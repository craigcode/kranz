name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 11 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # GitHub code scanning may be unavailable while this repository is
    # private. The workflow becomes automatic as soon as visibility is public;
    # workflow_dispatch remains available to prove entitlement beforehand.
    if: github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch'
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:${{ matrix.language }}
