name: release

# A tag is only a request to release. Version alignment, current-main
# provenance, the full source/history audit, and project gates all run before
# any artifact is built. The protected `release` environment is the final
# operator approval.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch every ref exposed by a public GitHub repository
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*:refs/remotes/pull/*'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/dashboard/package-lock.json
            apps/even-g2/package-lock.json

      - name: Verify tag, versions, changelog, and current main
        run: scripts/check-release-version.sh

      - name: Verify public release switch
        env:
          KRANZ_PUBLIC_RELEASE_ENABLED: ${{ vars.KRANZ_PUBLIC_RELEASE_ENABLED }}
        run: |
          if [ "$KRANZ_PUBLIC_RELEASE_ENABLED" != true ]; then
            echo "release is locked: set KRANZ_PUBLIC_RELEASE_ENABLED=true only after docs/public-readiness.md is complete" >&2
            exit 1
          fi

      - name: Audit current public tree
        run: scripts/audit-public-tree.sh

      # Keep the scanner version and archive checksum explicit. The generic
      # event-oriented action scans a push/PR range; a public release must
      # inspect every fetched head, tag, and pull ref via the history audit's
      # explicit `--all`.
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_LINUX_X64_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan all reachable history for secrets and operator metadata
        run: scripts/audit-public-history.sh

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace --no-fail-fast

      - run: cargo build --workspace --locked

      - name: Build strict public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          command: check

      - run: npm ci
        working-directory: apps/dashboard

      - run: npm audit --audit-level=high
        working-directory: apps/dashboard

      - run: npx tsc -b
        working-directory: apps/dashboard

      - run: npm run test
        working-directory: apps/dashboard

      - run: npm run build
        working-directory: apps/dashboard

      - run: npm run check-embedded
        working-directory: apps/dashboard

      - run: npm run lint
        working-directory: apps/dashboard

      - run: npm ci
        working-directory: apps/even-g2

      - run: npm audit --audit-level=high
        working-directory: apps/even-g2

      - run: npm run test
        working-directory: apps/even-g2

      - run: npm run build
        working-directory: apps/even-g2

      - run: npm run lint
        working-directory: apps/even-g2

  build:
    name: build ${{ matrix.asset }}
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: kranz-linux-x86_64
            bin: kranz
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            asset: kranz-macos-aarch64
            bin: kranz
            target: aarch64-apple-darwin
          - os: macos-latest
            asset: kranz-macos-x86_64
            bin: kranz
            target: x86_64-apple-darwin
          - os: windows-latest
            asset: kranz-windows-x86_64
            bin: kranz.exe
            target: x86_64-pc-windows-msvc
          # Native Windows-on-ARM. Without it, ARM users run the x86_64 asset
          # under emulation — correct, but it makes the M7 operator overhead
          # receipt (measured on aarch64) attest no shipped artifact.
          #
          # This leg was proven before v0.2.0 shipped rather than discovered
          # mid-release: a branch probe built this exact target on this exact
          # runner, confirmed the PE machine word is 0xAA64, and ran the
          # binary (run 32764000460, 10m17s).
          - os: windows-11-arm
            asset: kranz-windows-aarch64
            bin: kranz.exe
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `aws-lc-sys` cannot assemble its ARM64 crypto with MSVC alone: cl.exe
      # will not build the .S sources and the link dies on a missing
      # chacha-armv8.o. clang is REQUIRED on this leg, not merely nice to
      # have. (aws-lc is pulled in by rustls feature unification even though
      # main() installs the ring provider — see crates/cli/src/main.rs.)
      #
      # NOTE: as of the 2026-08 image the runner already ships clang, so the
      # guard below short-circuits and the `choco install` path is UNPROVEN.
      # It is kept as insurance against a future image dropping it, which is
      # precisely the failure that blocks an ARM64 build.
      - name: Install clang for aws-lc-sys (Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (Get-Command clang -ErrorAction SilentlyContinue) {
            "clang already present: $((Get-Command clang).Source)"
          } else {
            choco install llvm --no-progress -y
            "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build kranz CLI
        run: cargo build --release --locked -p kranz --bin kranz --target "${{ matrix.target }}"

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}.exe"

      - name: Attest binary build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.asset }}*

      - name: Upload staged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*
          if-no-files-found: error
          retention-days: 1

  sbom:
    name: generate source SBOM
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: kranz-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kranz-sbom
          path: kranz-sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksum manifest
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kranz-sbom.spdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
