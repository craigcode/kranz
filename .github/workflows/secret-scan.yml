name: secret-scan

on:
  # Unlike `pull_request`, this loads the workflow from the base branch. The
  # job must therefore never execute files from the proposed commit. No
  # workflow_dispatch: a manual dispatch lets any writable ref supply the
  # scanner and allowlist (SCAN_BASE = that ref's tip), i.e. a self-judging
  # scan — the hole the trusted-base design exists to close.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  # `pull_request_target` runs against the base SHA. Publish the trusted result
  # on the proposed SHA so branch protection can require it.
  statuses: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR scan pending
        # Dependabot-triggered runs get a read-only token even under
        # pull_request_target — the status POST would 403. Bot PRs still get
        # the Actions check-run conclusion as the signal.
        if: github.event_name == 'pull_request_target' && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state=pending \
            -f context=secret-scan \
            -f description='Trusted secret scan is running' \
            -f target_url="$RUN_URL"
      - name: Check out trusted repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Determine scan range
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only fetch the proposed commit as inert Git data. Every executable
          # in this job, including the scanner and this workflow, comes from
          # the trusted side of the change.
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
            fetched_sha="$(git rev-parse FETCH_HEAD)"
            if [ "$fetched_sha" != "$PR_HEAD_SHA" ]; then
              echo "fetched PR head $fetched_sha does not match event head $PR_HEAD_SHA" >&2
              exit 1
            fi
            echo "SCAN_RANGE=${PR_BASE_SHA}..${PR_HEAD_SHA}" >> "$GITHUB_ENV"
            echo "SCAN_BASE=${PR_BASE_SHA}" >> "$GITHUB_ENV"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            echo "SCAN_RANGE=${empty_tree}..${EVENT_SHA}" >> "$GITHUB_ENV"
            echo "SCAN_BASE=${EVENT_SHA}" >> "$GITHUB_ENV"
          else
            echo "SCAN_RANGE=${BEFORE_SHA}..${EVENT_SHA}" >> "$GITHUB_ENV"
            echo "SCAN_BASE=${BEFORE_SHA}" >> "$GITHUB_ENV"
          fi
      - name: Check out the trusted scanner
        shell: bash
        run: git worktree add --detach "$RUNNER_TEMP/kranz-scan-base" "$SCAN_BASE"
      - name: Build the trusted scanner
        # Build into the cached workspace target dir — the worktree's own
        # target/ is outside rust-cache, so it would be a cold build every run.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --locked --package kranz --bin kranz
        working-directory: ${{ runner.temp }}/kranz-scan-base
      - name: Scan the proposed range with trusted policy
        run: '"${{ github.workspace }}/target/debug/kranz" scan --range "$SCAN_RANGE"'
        working-directory: ${{ runner.temp }}/kranz-scan-base
      - name: Report PR scan result
        if: always() && github.event_name == 'pull_request_target' && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description='Trusted secret scan passed'
          else
            state=failure
            description='Trusted secret scan failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state="$state" \
            -f context=secret-scan \
            -f description="$description" \
            -f target_url="$RUN_URL"
