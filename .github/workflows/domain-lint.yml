name: domain-lint

on:
  # Trusted base, same as secret-scan.yml (read its header comment first):
  # `pull_request_target` loads this workflow from the base branch, so nothing
  # the change proposes is ever executed. The posture applies here for the
  # same reason — the linter, the hashed denylist, and the allowlist all
  # travel with the repository, so a plain `pull_request` job would let a
  # change weaken its own judge (un-ban a term, waive its own leak, gut the
  # scanner). No workflow_dispatch: a manual dispatch lets any writable ref
  # supply the linter and policy (TRUSTED_SHA = that ref's tip), i.e. a
  # self-judging lint.
  #
  # What differs from secret-scan: the lint's scope is the whole tree, not a
  # diff range. The job therefore checks out the PROPOSED tree as inert data,
  # overlays the TRUSTED policy files onto it, and runs the TRUSTED-built
  # linter against it — proposed content, trusted judge and policy.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  # `pull_request_target` runs against the base SHA. Publish the trusted result
  # on the proposed SHA so branch protection can require it.
  statuses: write

jobs:
  domain-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR lint pending
        # Dependabot-triggered runs get a read-only token even under
        # pull_request_target — the status POST would 403. Bot PRs still get
        # the Actions check-run conclusion as the signal.
        if: github.event_name == 'pull_request_target' && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state=pending \
            -f context=domain-lint \
            -f description='Trusted domain-vocabulary lint is running' \
            -f target_url="$RUN_URL"
      - name: Check out trusted repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Determine trusted and proposed SHAs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # TRUSTED supplies the linter and the policy; PROPOSED supplies only
          # the tree content being judged. Only fetch the proposed commit as
          # inert Git data.
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
            fetched_sha="$(git rev-parse FETCH_HEAD)"
            if [ "$fetched_sha" != "$PR_HEAD_SHA" ]; then
              echo "fetched PR head $fetched_sha does not match event head $PR_HEAD_SHA" >&2
              exit 1
            fi
            echo "TRUSTED_SHA=${PR_BASE_SHA}" >> "$GITHUB_ENV"
            echo "PROPOSED_SHA=${PR_HEAD_SHA}" >> "$GITHUB_ENV"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "TRUSTED_SHA=${EVENT_SHA}" >> "$GITHUB_ENV"
            echo "PROPOSED_SHA=${EVENT_SHA}" >> "$GITHUB_ENV"
          else
            # A reviewed history replacement can leave the previous main tip
            # outside every branch fetched by checkout. Fetch that exact event
            # SHA so the scanner and policy still come from the trusted base.
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            echo "TRUSTED_SHA=${BEFORE_SHA}" >> "$GITHUB_ENV"
            echo "PROPOSED_SHA=${EVENT_SHA}" >> "$GITHUB_ENV"
          fi
      - name: Check out the trusted linter
        shell: bash
        run: git worktree add --detach "$RUNNER_TEMP/kranz-domain-lint-base" "$TRUSTED_SHA"
      - name: Build the trusted linter
        # Build into the cached workspace target dir — the worktree's own
        # target/ is outside rust-cache, so it would be a cold build every run.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --locked --package kranz --bin kranz
        working-directory: ${{ runner.temp }}/kranz-domain-lint-base
      - name: Check out the proposed tree as inert data
        shell: bash
        run: git worktree add --detach "$RUNNER_TEMP/kranz-domain-lint-proposed" "$PROPOSED_SHA"
      - name: Overlay trusted policy onto the proposed tree
        # The proposed tree contributes CONTENT only. A change cannot un-ban a
        # term or waive its own leak: the denylist and allowlist always come
        # from the trusted side. A policy file absent on the trusted side
        # means "no such policy" — remove it from the proposed tree too; the
        # lint step then takes the documented bootstrap path below (never the
        # proposed policy).
        shell: bash
        run: |
          for policy in .kranz/domain-denylist.json .kranz/domain-allowlist; do
            if git cat-file -e "$TRUSTED_SHA:$policy" 2>/dev/null; then
              git -C "$RUNNER_TEMP/kranz-domain-lint-proposed" checkout "$TRUSTED_SHA" -- "$policy"
            else
              rm -f "$RUNNER_TEMP/kranz-domain-lint-proposed/$policy"
            fi
          done
      - name: Lint the proposed tree with trusted policy
        # Bootstrap posture: a trusted base that predates the policy has
        # nothing to judge WITH (the landing push of this very workflow, or
        # the policy's own introduction) — skip with a loud note and success.
        # The proposed policy is NEVER substituted (that is the self-judgment
        # hole the trusted-base design exists to close); the gate begins with
        # the first base that carries the policy.
        run: |
          if [ ! -f "$RUNNER_TEMP/kranz-domain-lint-proposed/.kranz/domain-denylist.json" ]; then
            echo "::notice::trusted base carries no domain denylist (workflow bootstrap or the policy's own introduction) — judging nothing; the gate begins with the first base that has the policy"
            exit 0
          fi
          "${{ github.workspace }}/target/debug/kranz" --repo "$RUNNER_TEMP/kranz-domain-lint-proposed" domain-lint
      - name: Report PR lint result
        if: always() && github.event_name == 'pull_request_target' && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description='Trusted domain-vocabulary lint passed'
          else
            state=failure
            description='Trusted domain-vocabulary lint failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state="$state" \
            -f context=domain-lint \
            -f description="$description" \
            -f target_url="$RUN_URL"
