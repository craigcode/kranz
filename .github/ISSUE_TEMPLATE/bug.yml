name: Bug report
description: Report a reproducible Kranz defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include secrets here. Use private vulnerability reporting for security concerns.
  - type: input
    id: version
    attributes:
      label: Kranz version or commit
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, backend CLI/version, and sandbox mode
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Redacted reproduction
      description: Minimal steps and inputs, with credentials and private data removed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Data hygiene
      options:
        - label: I removed credentials, authentication files, personal paths, and private transcript content.
          required: true
