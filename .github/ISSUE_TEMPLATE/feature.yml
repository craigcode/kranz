name: Feature request
description: Propose a focused governance or evidence-layer improvement
title: "[request] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or contributor problem needs solving?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: What evidence supports this priority, and what existing workaround did you consider?
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Product boundary
      description: Kranz is a governance/evidence harness, not an agent-capability framework.
      options:
        - Governance, verification, audit, or operator workflow
        - Unsure; boundary review requested
    validations:
      required: true
