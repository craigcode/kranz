[advisories]
# The GTK 3 stack requires GLib 0.18. Its version still matches this advisory,
# but vendor/glib carries the exact upstream fix from gtk-rs-core #1343.
# This is a patched-source disposition, not acceptance of the original bug.
# CI must run scripts/check-desktop-backports.py before this audit: it verifies
# all vendored bytes, the reviewed patch scope, and lockfile path resolution.
# Optimized iterator and compiler-diagnostic tests run in security-tests.
# Remove the patch and this disposition when compatible upstream packages ship
# the fix or Tauri leaves GTK 3. See vendor/README.md for provenance.
# RUSTSEC-2024-0370 is resolved by removing proc-macro-error and its attribute
# crate.
# RUSTSEC-2026-0543 (issued 2026-11-17) is the one maintenance advisory
# ignored: informational, chrono is unmaintained, with no vulnerability
# reported and no patched version. Waived by the operator on 2026-11-17, with
# the same entry in the root deny.toml. Ticket `replace-chrono` does the
# replacement and removes both entries.
ignore = ["RUSTSEC-2024-0429", "RUSTSEC-2026-0543"]
