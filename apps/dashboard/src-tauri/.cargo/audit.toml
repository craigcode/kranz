[advisories]
# Standalone Tauri desktop lockfile (apps/dashboard/src-tauri/Cargo.lock)
# advisory disposition (ticket: tauri-informational-advisory-disposition):
#
# Cleared by upstream upgrade to tauri 2.12.2 / tauri-build 2.6.3 / wry 0.57.0
# (no longer present in Cargo.lock):
# - RUSTSEC-2025-0081 (unic-char-property 0.9.0)
# - RUSTSEC-2025-0075 (unic-char-range 0.9.0)
# - RUSTSEC-2025-0080 (unic-common 0.9.0)
# - RUSTSEC-2025-0100 (unic-ucd-ident 0.9.0)
# - RUSTSEC-2025-0098 (unic-ucd-version 0.9.0)
#
# Remaining Linux-only transitive advisories with explicit disposition:
#
# 1. RUSTSEC-2024-0429 — package: glib 0.18.5 (unsound Iterator/DoubleEndedIterator
#    impls on glib::VariantStrIter).
#    - Platform evidence: absent on macOS (aarch64-apple-darwin, x86_64-apple-darwin)
#      and Windows (x86_64-pc-windows-msvc, aarch64-pc-windows-msvc) where
#      `cargo tree --locked --target <triple> -i glib` resolves to an empty graph;
#      pulled in only on Linux (`x86_64-unknown-linux-gnu`) via
#      `tauri 2.12.2 -> wry 0.57.0 / webkit2gtk 2.0.2 / gtk 0.18.2 -> glib 0.18.5`.
#    - Call-path evidence: `apps/dashboard/src-tauri/src/{lib,main}.rs` makes zero
#      direct calls to `glib`, `Variant`, or `VariantStrIter`. Upstream fixed this
#      in `glib >= 0.20.0`, which is semver-incompatible with the GTK 3 (`gtk 0.18`)
#      binding series pinned by Tauri 2.x.
#    - Re-review condition: remove when Tauri/wry upgrades its Linux GTK/webkit2gtk
#      stack to `glib >= 0.20.0`, or if `src-tauri` adds any direct `glib` usage.
#
# 2. RUSTSEC-2024-0370 — package: proc-macro-error 1.0.4 (unmaintained).
#    - Platform evidence: absent on macOS (aarch64-apple-darwin, x86_64-apple-darwin)
#      and Windows (x86_64-pc-windows-msvc, aarch64-pc-windows-msvc) where
#      `cargo tree --locked --target <triple> -i proc-macro-error` is empty;
#      pulled in only on Linux (`x86_64-unknown-linux-gnu`) as a compile-time
#      proc-macro dependency via `glib 0.18.5 -> glib-macros 0.18.5` and
#      `gtk 0.18.2 -> gtk3-macros 0.18.2`.
#    - Call-path evidence: compile-time macro helper only; no code from
#      `proc-macro-error` is linked into the runtime desktop binary.
#    - Re-review condition: remove together with RUSTSEC-2024-0429 when Tauri/wry
#      leaves the `gtk 0.18` / `glib 0.18` series.
ignore = ["RUSTSEC-2024-0429", "RUSTSEC-2024-0370"]
