# Dependency policy for every publishable Rust workspace crate. Keep this file
# explicit: cargo-deny defaults reject all licenses when no allow-list exists.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# RUSTSEC-2026-0543 (issued 2026-11-17): informational, chrono is
# unmaintained. It reports no vulnerability and no unsound code, and no
# patched version exists. Waived by the operator on 2026-11-17 so the
# workspace can keep merging while chrono is replaced. Ticket
# `replace-chrono` does the replacement and removes this entry. Every other
# advisory, including any later one against chrono, still fails this check.
ignore = ["RUSTSEC-2026-0543"]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
