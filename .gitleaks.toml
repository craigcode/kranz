[extend]
useDefault = true

# Synthetic scrubber fixtures, reviewed before the one-commit import. A commit
# fingerprint cannot refer to the commit containing its own ignore entry.
# Require BOTH the exact file and exact detected bytes, scoped to the rule.
# New values in these files remain findings; no path- or rule-wide exemptions.

[[allowlists]]
description = "Synthetic scrubber fixture at crates/engine/tests/hooks_test.rs:319"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''\Acrates/engine/tests/hooks_test\.rs\z''']
regexes = ['''\Aghp_abcdefghij1234567890ABCD\z''']

