[[allowlists]]
description = "Synthetic scrubber fixture at crates/engine/tests/scrub_test.rs:423"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''\Acrates/engine/tests/scrub_test\.rs\z''']
regexes = ['''\A-----BEGIN RSA PRIVATE KEY-----\\nMIIEpAIBAAKCAQEA7x8\\nQIDAQAB\\n-----END RSA PRIVATE KEY-----\\nafter";
    let out = scrub\(text\);
    assert_eq!\(out, "before\\n\[REDACTED\]\\nafter"\);
\}

