# cargo-about 0.9.2: CLI dependency graph across every released target.
# Build dependencies stay included because they can emit shipped code.
accepted = [
  "MIT", "CC0-1.0", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC",
  "Unicode-3.0", "Unlicense", "Zlib", "OpenSSL",
]
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
workarounds = ["ring"]

# Bind ambiguous/missing harvested texts to the upstream bytes. These
